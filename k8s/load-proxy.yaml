apiVersion: v1
kind: ConfigMap
metadata:
  name: load-proxy
  namespace: thesis-autoscaling
data:
  default.conf: |
    server {
      listen 8080;
      access_log off;
      location / {
        proxy_pass http://demo-app:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection close;
        proxy_next_upstream off;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        add_header X-Load-Route clusterip always;
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: load-proxy
  namespace: thesis-autoscaling
spec:
  replicas: 1
  selector:
    matchLabels:
      app: load-proxy
  template:
    metadata:
      labels:
        app: load-proxy
    spec:
      containers:
        - name: nginx
          image: nginx:1.28-alpine
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 100m
              memory: 32Mi
            limits:
              cpu: "1"
              memory: 128Mi
          readinessProbe:
            tcpSocket:
              port: 8080
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/conf.d
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: load-proxy
---
apiVersion: v1
kind: Service
metadata:
  name: load-proxy
  namespace: thesis-autoscaling
spec:
  selector:
    app: load-proxy
  ports:
    - port: 8000
      targetPort: 8080
